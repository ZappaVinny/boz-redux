name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Arch matches the development toolchain: 32-bit multilib for Linux, MinGW-w64 for Windows.
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86
            target: linux
            artifact: BOZ-Redux-linux-x86
            path: runtime/build/linux-x86/package/BOZ-Redux-linux-x86.tar.gz
          - name: Windows x86
            target: windows
            artifact: BOZ-Redux-windows-x86
            path: runtime/build/windows-x86/package/BOZ-Redux-windows-x86.zip
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        if: matrix.target == 'windows'
        with:
          path: runtime/build/downloads
          key: windows-gl-${{ hashFiles('runtime/scripts/fetch-mesa-windows.sh', 'runtime/scripts/fetch-angle-windows.sh') }}

      - name: Build, test and package
        working-directory: runtime
        run: scripts/ci.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

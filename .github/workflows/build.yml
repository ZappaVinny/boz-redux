name: Build

on:
  push:
    branches: [main, 64-migration]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Arch matches the development toolchain: 32-bit multilib for Linux, MinGW-w64 for Windows.
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86
            target: linux
            artifact: BOZ-Redux-linux-x86
            path: build/linux-x86/package/BOZ-Redux-linux-x86.tar.gz
          - name: Windows x86
            target: windows
            arch: x86
            artifact: BOZ-Redux-windows-x86
            path: build/windows-x86/package/BOZ-Redux-windows-x86.zip
          - name: Windows x64
            target: windows64
            arch: x64
            artifact: BOZ-Redux-windows-x64
            path: build/windows-x64/package/BOZ-Redux-windows-x64.zip
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        if: matrix.arch
        with:
          path: build/downloads
          key: windows-gl-${{ matrix.arch }}-${{ hashFiles('scripts/fetch-mesa-windows.sh', 'scripts/fetch-angle-windows.sh') }}

      - name: Build, test and package
        run: scripts/ci.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

      - uses: actions/upload-artifact@v4
        if: matrix.arch
        with:
          name: windows-tests-${{ matrix.arch }}
          path: build/windows-${{ matrix.arch }}/tests/*_test.exe
          retention-days: 1

  # The 64-bit client and its tests, in the PC memory map and the guest-base map Android uses.
  linux64:
    name: Linux x64 (PC and guest-base maps)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build, test and package
        run: scripts/ci.sh linux64

      - uses: actions/upload-artifact@v4
        with:
          name: BOZ-Redux-linux-x64
          path: build/linux-x64/package/BOZ-Redux-linux-x64.tar.gz

  # The Android APK (arm64, phones). The runner image has the Android SDK; the NDK and CMake
  # versions the Gradle build asks for are installed here.
  android:
    name: Android (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      # Release build (the debug one is unoptimised and too slow to play). Signed with the key in
      # the BOZ_ANDROID_KEYSTORE_BASE64, BOZ_ANDROID_KEYSTORE_PASSWORD and BOZ_ANDROID_KEY_ALIAS
      # secrets when set, else a throwaway debug key: updates only install over the same key, so
      # public releases need the secrets.
      - name: Build the APK
        working-directory: packaging/android
        env:
          KEYSTORE_BASE64: ${{ secrets.BOZ_ANDROID_KEYSTORE_BASE64 }}
          BOZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BOZ_ANDROID_KEYSTORE_PASSWORD }}
          BOZ_ANDROID_KEY_ALIAS: ${{ secrets.BOZ_ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/boz.keystore"
            export BOZ_ANDROID_KEYSTORE="$RUNNER_TEMP/boz.keystore"
          fi
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BOZ-Redux-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BOZ-Redux-android-arm64
          path: packaging/android/BOZ-Redux-android-arm64.apk

  # The Windows build on real Windows: unit tests, then the extractor and the launcher start.
  windows-test:
    name: Windows tests (${{ matrix.arch }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Get the gamedef
        run: git submodule update --init gamedef

      - uses: actions/download-artifact@v4
        with:
          name: BOZ-Redux-windows-${{ matrix.arch }}
          path: build/windows-${{ matrix.arch }}/package

      - uses: actions/download-artifact@v4
        with:
          name: windows-tests-${{ matrix.arch }}
          path: build/windows-${{ matrix.arch }}/tests

      - name: Test
        run: BOZ_ARCH=${{ matrix.arch }} scripts/test-windows.sh

  # The Windows build made on Windows itself (MSYS2 MINGW32), for contributors without Linux:
  # it must configure, build and pass the unit tests just like the cross build.
  windows-native:
    name: Windows native (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Build and test
        run: |
          cmake --preset windows-x86-msys2
          cmake --build --preset windows-x86-msys2-tests
          ctest --test-dir build/windows-x86 --output-on-failure

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-test, linux64, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BOZ-Redux-*
          path: artifacts
          merge-multiple: true

      # The launcher checks its download against SHA256SUMS before installing an update.
      - name: Checksums
        run: cd artifacts && sha256sum BOZ-Redux-* > SHA256SUMS && cat SHA256SUMS

      # A tag with a pre-release part (v0.4.0-beta.1) is a test version: only launchers set
      # to include test versions offer it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* $pre \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
